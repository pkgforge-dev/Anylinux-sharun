cargo-features = ["panic-immediate-abort"]

[package]
name = "sharun"
version = "3.10.0"
readme = "README.md"
license = "MIT"
repository = "https://github.com/pkgforge-dev/Anylinux-sharun"
description = "Run dynamically linked ELF binaries everywhere"
edition = "2021"

[profile.release]
lto = true
opt-level = "z"
strip = "symbols"
debug  = false
codegen-units = 1
panic = "immediate-abort"

[profile.dev]
opt-level = 0

[dependencies]
goblin = "0.8.2"
walkdir = "2.5.0"
userland-execve = { git = "https://github.com/pkgforge-dev/userland-execve-rust", rev = "d2b58d8b5164b8c815c3f504eb3ddfff47f31556" } # v0.3.2
old-linux-kernel-compat-layer = { git = "https://github.com/pkgforge-dev/old-linux-kernel-compat-layer", rev = "db1506a17cd2c3b94fdb88462ed330fef2f22c29" } # main, after #5
nix = { version = "0.31.1", features = [ "fs" ] }
